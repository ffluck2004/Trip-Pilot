server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5431/trippilot
    username: trippilot
    password: trippilot
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: trippilot-super-secret-jwt-key-that-is-long-enough-for-hs512-algorithm-minimum-64-bytes!!
  expiration-ms: 604800000

gemini:
  api-key: ${GEMINI_API_KEY:}

app:
  cors:
    allowed-origins: http://localhost:5173
