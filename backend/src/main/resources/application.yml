server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5431/trippilot}
    username: ${SPRING_DATASOURCE_USERNAME:trippilot}
    password: ${SPRING_DATASOURCE_PASSWORD:trippilot}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: ${JWT_SECRET:trippilot-super-secret-jwt-key-that-is-long-enough-for-hs512-algorithm-minimum-64-bytes!!}
  expiration-ms: 604800000

gemini:
  api-key: ${GEMINI_API_KEY:}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://trip-pilot-delta.vercel.app}
